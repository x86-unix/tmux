# === General ===
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# === Mouse ===
set -g mouse on

# === Clipboard (OSC 52) ===
set -g set-clipboard on
set -as terminal-features ',tmux-256color:clipboard'

# === Vi copy mode ===
setw -g mode-keys vi
