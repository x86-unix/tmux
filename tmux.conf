# === Mouse Support ===
set -g mouse on

# --- Word selection (double-click) ---
bind -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# --- Line selection (triple-click) ---
bind -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# --- Drag selection -> clipboard ---
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# --- Scroll wheel enters copy mode ---
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "if -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# === General ===
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# vi mode for copy
setw -g mode-keys vi
