# === General ===
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# === Mouse ===
set -g mouse on

# === Clipboard (OSC 52) ===
set -g set-clipboard on
set -as terminal-features ',tmux-256color:clipboard'

# === Copy ===
# Drag select → clipboard
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Double-click → word select → clipboard
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Triple-click → line select → clipboard
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# === Paste ===
bind p run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"
bind -n MouseDown3Pane run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"
